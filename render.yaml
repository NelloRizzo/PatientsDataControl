services:
  - type: web
    name: healthbridge-api
    runtime: node
    region: ohio
    plan: free
    branch: main
    buildCommand: npm ci && npm run build --workspace=packages/backend
    startCommand: node packages/backend/dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: EMAIL_HOST
        value: smtp-relay.brevo.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_SECURE
        value: "false"
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_FROM
        value: noreply@healthbridge.com
      - key: APP_URL
        value: https://healthbridge-frontend.onrender.com

  - type: web
    name: healthbridge-frontend
    runtime: node
    region: ohio
    plan: free
    branch: main
    buildCommand: npm ci && npm run build --workspace=packages/frontend
    startCommand: node packages/frontend/server.js
    envVars:
      - key: VITE_API_URL
        value: https://healthbridge-api.onrender.com
